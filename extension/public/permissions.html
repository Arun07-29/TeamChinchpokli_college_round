<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>IntentLock — Camera Permission</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f9f9f9;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      color: #333;
    }
    .card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      padding: 40px 36px;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .icon { font-size: 40px; margin-bottom: 12px; }
    h2 { margin: 0 0 12px; font-size: 20px; }
    p  { color: #555; font-size: 14px; line-height: 1.5; margin: 0 0 24px; }
    button {
      background: #007bff;
      color: #fff;
      border: none;
      padding: 12px 28px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover  { background: #0056b3; }
    button:active { background: #004085; }
    #status {
      margin-top: 20px;
      padding: 12px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📷 🎤</div>
    <h2>Permissions Required</h2>
    <p>
      Chrome must ask for camera and microphone permissions inside a full tab.<br />
      Click the button below — a browser prompt will appear at the top of this window.
      Click <strong>Allow</strong> and then close this tab.
    </p>
    <button id="requestBtn">Request Access</button>
    <div id="status"></div>
  </div>
  <script src="permissions.js"></script>
</body>
</html>
